name: myapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  cupertino_icons: ^1.0.8
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  email_validator: ^3.0.0
  image_picker: ^1.1.2
  supabase_flutter: ^2.3.4
  cloud_firestore: ^6.3.0
  video_player: ^2.8.2
  flutter_web_auth_2: ^5.0.2
  http: ^1.2.0
  connectivity_plus: ^6.0.0
  firebase_messaging: ^16.2.2
  provider: ^6.0.5
  shared_preferences: ^2.2.2
  flutter_localizations:
    sdk: flutter


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0

flutter_icons:
  android: true
  ios: true
  image_path: "lib/assets/images/Android Medium - 5.png"
  adaptive_icon_background: "lib/assets/images/Android Medium - 2.png"
  adaptive_icon_foreground: "lib/assets/images/Android Medium - 1.png"

flutter_native_splash:
  color: "#FFFFFF"                       
  image: "lib/assets/images/icons.png"     

  android_12:
    image: "lib/assets/images/icons.png"   
    icon_background_color: "#FFFFFF"

  ios: true
  android: true

flutter:
  uses-material-design: true

  assets:
    - lib/assets/images/
    - .env

  fonts:
    - family: GreatVibes
      fonts:
        - asset: lib/fonts/GreatVibes-Regular.ttf

    - family: Amagro
      fonts:
        - asset: lib/fonts/Amagro.ttf

    - family: Alana
      fonts:
        - asset: lib/fonts/Alana_Pro_RUS.otf
